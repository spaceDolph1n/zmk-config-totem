# Labels for bindings that would otherwise render as raw devicetree in the
# diagram. Keys are matched against the raw binding after preprocessing, which
# is why the two &kp entries are the expanded form of HY(F) and the scroll chord.
parse_config:
  raw_binding_map:
    '&studio_unlock': Studio
    '&snip': Snip
    '&lock': Lock
    '&euro': '€'
    '&kp LC(LS(LA(LG(F))))': Homerow
    '&kp LS(LG(J))': Scroll
